name: "Baseline RE-EVAL per-task (dewrapped GT-off, 1 job/task)"

# Eval-ONLY, per-task matrix (monitor_300 style). One GHA job per instance so a
# per-task artifact (reeval-task-<id>) lands the moment that task finishes and is
# downloadable MID-RUN -> the 6-metric climbs continuously instead of jumping at
# batch end. 300 tasks > the 256 matrix cap, so dispatch TWICE: half=0 (tasks
# 0-149) and half=1 (tasks 150-299).
#
# Images: on-demand pull from the COMPLETE public source Docker Hub `starryzhang`
# (the partial ghcr.io/harneet2512 cache 404'd ~54% of tasks). --cache_level none
# removes the single task image right after -> ~1 image peak. 1 pull/job across
# many runner IPs => no Docker Hub rate-limit exposure (auth added as backstop).

on:
  workflow_dispatch:
    inputs:
      preds_path:
        description: "Dewrapped predictions.jsonl in the checkout (NON-LFS)"
        required: true
        default: "eval_preds/baseline_dewrapped_preds.jsonl"
      half:
        description: "Which 150-task half (300 > 256 matrix cap). Ignored when task_ids is set."
        required: true
        type: choice
        options: ["0", "1"]
        default: "0"
      task_ids:
        description: "Comma-separated instance_ids to re-run (overrides half slice). Blank = use half."
        required: false
        default: ""
      harness_timeout:
        description: "Per-instance harness --timeout seconds (raise for slow suites e.g. conan)"
        required: true
        default: "1800"
      max_parallel:
        description: "Concurrent task jobs in THIS half (keep both halves' sum under the account concurrency cap)"
        required: true
        default: "7"
      namespace:
        description: "Image source (starryzhang = complete Docker Hub source)"
        required: true
        default: "starryzhang"
      run_tag:
        description: "Run id for harness logs"
        required: true
        default: "baseline_reeval_pt"

permissions:
  contents: read
  packages: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.split.outputs.matrix }}
      count: ${{ steps.split.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - id: split
        name: Build per-task matrix for this half
        run: |
          set -euo pipefail
          PREDS="${{ inputs.preds_path }}"
          test -f "$PREDS" || { echo "::error::preds not found: $PREDS"; exit 1; }
          BYTES=$(wc -c < "$PREDS")
          [ "$BYTES" -ge 1000 ] || { echo "::error::preds suspiciously small ($BYTES B) — LFS pointer?"; head -c 300 "$PREDS"; exit 1; }
          python3 - "$PREDS" "${{ inputs.half }}" "${{ inputs.task_ids }}" << 'PYEOF'
          import json, os, sys
          src, half, task_ids = sys.argv[1], int(sys.argv[2]), sys.argv[3].strip()
          ids = [json.loads(l)["instance_id"] for l in open(src, encoding="utf-8") if l.strip()]
          if task_ids:
              want = [x.strip() for x in task_ids.split(",") if x.strip()]
              chunk = [i for i in ids if i in set(want)]   # preserve preds order, only known ids
              print(f"task_ids override: {len(chunk)}/{len(want)} requested ids matched")
          else:
              chunk = ids[half*150:(half+1)*150]
              print(f"half {half}: {len(chunk)} tasks ({chunk[0]} .. {chunk[-1]})")
          if not chunk:
              raise SystemExit("no tasks selected")
          matrix = {"include": [{"iid": i} for i in chunk]}
          with open(os.environ["GITHUB_OUTPUT"], "a") as gh:
              gh.write(f"matrix={json.dumps(matrix)}\n")
              gh.write(f"count={len(chunk)}\n")
          PYEOF

  eval:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DOCKER_CLIENT_TIMEOUT: "300"
      COMPOSE_HTTP_TIMEOUT: "300"
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false
      max-parallel: ${{ fromJson(inputs.max_parallel) }}
    steps:
      - name: Free disk space (headroom for slow/large suites)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/share/swift /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell /usr/local/share/chromium \
            /opt/hostedtoolcache/go /opt/hostedtoolcache/node 2>/dev/null || true
          docker system prune -af >/dev/null 2>&1 || true
          df -h /

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache SWE-bench-Live harness
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            /tmp/SWE-bench-Live
          key: swebench-live-harness-py312-v1

      - name: Install harness (skip if cached)
        run: |
          set -euo pipefail
          if python -c "import swebench" 2>/dev/null; then
            echo "swebench importable — cache hit"
          else
            [ -d /tmp/SWE-bench-Live/.git ] || git clone --depth 1 --branch python-only --recursive \
              https://github.com/microsoft/SWE-bench-Live.git /tmp/SWE-bench-Live
            cd /tmp/SWE-bench-Live && python -m pip install -e . 2>&1 | tail -2
          fi
          python -c "import swebench; print('swebench ready')"

      - name: Extract this task's prediction
        run: |
          set -euo pipefail
          python3 - "${{ inputs.preds_path }}" "${{ matrix.iid }}" << 'PYEOF'
          import json, sys
          src, iid = sys.argv[1], sys.argv[2]
          for l in open(src, encoding="utf-8"):
              if l.strip() and json.loads(l)["instance_id"] == iid:
                  open("/tmp/task.jsonl", "w", encoding="utf-8").write(l if l.endswith("\n") else l+"\n")
                  print("extracted", iid); break
          else:
              raise SystemExit(f"instance {iid} not found in {src}")
          PYEOF
          test -s /tmp/task.jsonl

      - name: Log in to Docker Hub (backstop; 1 pull/job)
        env:
          U1: ${{ secrets.DOCKERHUB_USER_1 }}
          P1: ${{ secrets.DOCKERHUB_PAT_1 }}
          U2: ${{ secrets.DOCKERHUB_USER_2 }}
          P2: ${{ secrets.DOCKERHUB_PAT_2 }}
        run: |
          if [ "${{ inputs.half }}" = "0" ]; then U="$U1"; P="$P1"; else U="$U2"; P="$P2"; fi
          if [ -n "$U" ] && [ -n "$P" ]; then
            echo "$P" | docker login docker.io -u "$U" --password-stdin >/dev/null 2>&1 \
              && echo "dockerhub login OK" || echo "::warning::dockerhub login failed — anonymous (1 pull, fine)"
          else
            echo "anonymous pull (1 image, under per-IP limit)"
          fi

      - name: Run evaluation (official harness, 1 task)
        run: |
          set -uo pipefail
          RUN_ID="${{ inputs.run_tag }}"
          echo "=== eval ${{ matrix.iid }} | namespace=${{ inputs.namespace }} ==="
          python -m swebench.harness.run_evaluation \
            --dataset_name SWE-bench-Live/SWE-bench-Live \
            --split lite \
            --namespace "${{ inputs.namespace }}" \
            --cache_level none \
            --timeout ${{ inputs.harness_timeout }} \
            --predictions_path /tmp/task.jsonl \
            --max_workers 1 \
            --run_id "$RUN_ID" \
            2>&1 | tee /tmp/task.log

      - name: Stage per-task result
        if: always()
        run: |
          set -uo pipefail
          RUN_ID="${{ inputs.run_tag }}"
          IID="${{ matrix.iid }}"
          OUT="/tmp/task_out"; mkdir -p "$OUT"
          RP="$(find "logs/run_evaluation/$RUN_ID" -name report.json 2>/dev/null | head -1)"
          if [ -n "$RP" ]; then
            cp "$RP" "$OUT/${IID}.report.json"
          else
            echo "::warning::no report.json for $IID (harness error) — capturing run_instance.log for diagnosis"
          fi
          # capture run_instance.log (real error cause when no report) + FULL harness stdout
          RIL="$(find "logs/run_evaluation/$RUN_ID" -name run_instance.log 2>/dev/null | head -1)"
          [ -n "$RIL" ] && cp "$RIL" "$OUT/${IID}.run_instance.log" 2>/dev/null || true
          find . -maxdepth 1 -name "*.$RUN_ID.json" -exec cp {} "$OUT/${IID}.summary.json" \; 2>/dev/null || true
          cp /tmp/task.log "$OUT/${IID}.full.log" 2>/dev/null || true
          tail -40 /tmp/task.log > "$OUT/${IID}.tail.log" 2>/dev/null || true
          # one-line verdict for quick reading
          python3 - "$OUT" "$IID" << 'PYEOF'
          import json, os, sys, glob
          out, iid = sys.argv[1], sys.argv[2]
          rp = os.path.join(out, f"{iid}.report.json")
          v = {"iid": iid, "has_report": os.path.exists(rp), "resolved": False, "patch_applied": False}
          if os.path.exists(rp):
              d = json.load(open(rp))
              r = d.get(iid) or next(iter(d.values()), {})
              v["resolved"] = bool(r.get("resolved"))
              v["patch_applied"] = bool(r.get("patch_successfully_applied"))
          json.dump(v, open(os.path.join(out, f"{iid}.verdict.json"), "w"))
          print("VERDICT", v)
          PYEOF
          ls -la "$OUT"

      - name: Upload per-task artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reeval-task-${{ matrix.iid }}
          path: /tmp/task_out/
          retention-days: 30
