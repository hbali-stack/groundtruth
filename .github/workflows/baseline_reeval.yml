name: "Baseline RE-EVAL (dewrapped mini-swe-agent GT-OFF, 0->300)"

# Eval-ONLY. No agent, no LLM. Applies each (already-dewrapped) baseline patch
# and runs the gold tests inside the official SWE-bench-Live task image, then
# writes the per-instance report.json the true baseline number is derived from.
#
# Why this exists: the recorded 32/300 is a HARNESS DEFECT — a PTY wrapped the
# agent patches at ~80 cols, so `git apply` rejected 204/300 as malformed BEFORE
# any test ran (auto-0). The dewrapped patches (rejoined continuation lines) get
# a REAL verdict here for the first time.
#
# Images: pulled ON DEMAND from the harneet2512 GHCR cache via
#   --namespace ghcr.io/harneet2512  (sweb.eval.x86_64.<repo>_1776_<rest>:latest).
# --cache_level env removes each instance image right after its eval, so peak
# disk = ~max_workers concurrent images (no pre-pull, no disk blowup, no
# Docker Hub rate-limit exposure). Flip `namespace` to `starryzhang` to fall
# back to the public Docker Hub source (Docker Hub login below covers that).

on:
  workflow_dispatch:
    inputs:
      preds_path:
        description: "Path to dewrapped predictions.jsonl in the checkout (NON-LFS)"
        required: true
        default: "eval_preds/baseline_dewrapped_preds.jsonl"
      batch_size:
        description: "Tasks per eval job (300 total)"
        required: true
        default: "100"
      max_workers:
        description: "Docker parallelism within each eval job (bounds peak disk)"
        required: true
        default: "4"
      max_parallel:
        description: "Max concurrent eval jobs"
        required: true
        default: "3"
      namespace:
        description: "Image source namespace (ghcr.io/harneet2512 = GHCR cache; starryzhang = Docker Hub)"
        required: true
        default: "ghcr.io/harneet2512"
      run_tag:
        description: "Run id prefix for harness logs"
        required: true
        default: "baseline_reeval"

permissions:
  contents: read
  packages: read

jobs:
  # ── Phase 1: split the committed predictions into eval batches ──────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.split.outputs.matrix }}
      total: ${{ steps.split.outputs.total }}
    steps:
      - uses: actions/checkout@v4

      - id: split
        name: Split predictions into batches
        run: |
          set -euo pipefail
          PREDS="${{ inputs.preds_path }}"
          if [ ! -f "$PREDS" ]; then
            echo "::error::predictions file not found: $PREDS"; exit 1
          fi
          BYTES=$(wc -c < "$PREDS")
          echo "predictions file: $PREDS ($BYTES bytes)"
          # Guard against an accidental LFS pointer (would be ~130 bytes).
          if [ "$BYTES" -lt 1000 ]; then
            echo "::error::predictions file is suspiciously small ($BYTES bytes) — is it an LFS pointer? put it under a NON-LFS path."
            head -c 400 "$PREDS"; exit 1
          fi

          mkdir -p /tmp/preds
          python3 - "$PREDS" "${{ inputs.batch_size }}" << 'PYEOF'
          import json, math, os, sys
          src, bs = sys.argv[1], int(sys.argv[2])
          preds = [json.loads(l) for l in open(src, encoding="utf-8") if l.strip()]
          n = math.ceil(len(preds) / bs) if preds else 0
          for i in range(n):
              chunk = preds[i*bs:(i+1)*bs]
              with open(f"/tmp/preds/eval_batch_{i}.jsonl", "w", encoding="utf-8") as out:
                  for p in chunk:
                      out.write(json.dumps(p) + "\n")
              print(f"  batch {i}: {len(chunk)} preds")
          matrix = {"include": [{"batch_id": i} for i in range(n)]}
          with open(os.environ["GITHUB_OUTPUT"], "a") as gh:
              gh.write(f"matrix={json.dumps(matrix)}\n")
              gh.write(f"total={len(preds)}\n")
          print(f"total={len(preds)}  batches={n}")
          PYEOF

      - name: Upload batch splits
        uses: actions/upload-artifact@v4
        with:
          name: reeval-splits
          path: /tmp/preds/eval_batch_*.jsonl
          retention-days: 7

  # ── Phase 2: parallel eval ──────────────────────────────────────────────
  eval:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      DOCKER_CLIENT_TIMEOUT: "300"
      COMPOSE_HTTP_TIMEOUT: "300"
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false
      max-parallel: ${{ fromJson(inputs.max_parallel) }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /usr/share/swift /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell /usr/local/share/chromium \
            /opt/hostedtoolcache/go /opt/hostedtoolcache/node || true
          docker system prune -af --volumes || true
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SWE-bench-Live eval harness (official)
        run: |
          set -euo pipefail
          if [ ! -d /tmp/SWE-bench-Live/.git ]; then
            git clone --depth 1 --branch python-only --recursive \
              https://github.com/microsoft/SWE-bench-Live.git /tmp/SWE-bench-Live
          fi
          cd /tmp/SWE-bench-Live && python -m pip install -e . 2>&1 | tail -3
          python -c "import swebench; print('swebench', swebench.__file__)"

      - name: Download batch splits
        uses: actions/download-artifact@v4
        with:
          name: reeval-splits
          path: /tmp/preds

      - name: Log in to GHCR (image cache source)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (fallback namespace source)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true

      - name: Run evaluation (official harness)
        run: |
          set -uo pipefail
          BATCH="/tmp/preds/eval_batch_${{ matrix.batch_id }}.jsonl"
          RUN_ID="${{ inputs.run_tag }}_b${{ matrix.batch_id }}"
          test -s "$BATCH" || { echo "::error::batch file missing: $BATCH"; ls -la /tmp/preds; exit 1; }
          echo "=== batch ${{ matrix.batch_id }}: $(wc -l < "$BATCH") tasks | namespace=${{ inputs.namespace }} | run_id=$RUN_ID ==="

          python -m swebench.harness.run_evaluation \
            --dataset_name SWE-bench-Live/SWE-bench-Live \
            --split lite \
            --namespace "${{ inputs.namespace }}" \
            --cache_level env \
            --predictions_path "$BATCH" \
            --max_workers ${{ inputs.max_workers }} \
            --run_id "$RUN_ID" \
            2>&1 | tee /tmp/eval_b${{ matrix.batch_id }}.log

          echo "=== disk after eval ==="; df -h /

      - name: Stage results (per-instance report.json + harness summary)
        if: always()
        run: |
          set -uo pipefail
          RUN_ID="${{ inputs.run_tag }}_b${{ matrix.batch_id }}"
          OUT="/tmp/reeval_out"
          mkdir -p "$OUT"
          # (a) full per-instance report tree (authoritative)
          if [ -d "logs/run_evaluation/$RUN_ID" ]; then
            cp -r "logs/run_evaluation/$RUN_ID" "$OUT/report_tree"
          fi
          # (b) harness top-level summary json (has resolved_ids/completed_ids/...)
          find . -maxdepth 1 -name "*.$RUN_ID.json" -exec cp -v {} "$OUT/" \; 2>/dev/null || true
          cp -v /tmp/eval_b${{ matrix.batch_id }}.log "$OUT/" 2>/dev/null || true

          # (c) quick per-batch tally for live monitoring (not authoritative)
          python3 - "$OUT" "$RUN_ID" << 'PYEOF'
          import json, glob, os, sys
          out, run_id = sys.argv[1], sys.argv[2]
          reports = glob.glob(os.path.join(out, "report_tree", "**", "report.json"), recursive=True)
          resolved, applied, total = [], 0, len(reports)
          for rp in reports:
              try:
                  d = json.load(open(rp))
                  for iid, r in d.items():
                      if r.get("resolved"): resolved.append(iid)
                      if r.get("patch_successfully_applied") or r.get("patch_is_None") is False:
                          applied += 1
              except Exception as e:
                  print("WARN parse", rp, e)
          tally = {"run_id": run_id, "reports": total, "resolved": len(resolved),
                   "resolved_ids": sorted(resolved)}
          json.dump(tally, open(os.path.join(out, "batch_tally.json"), "w"), indent=2)
          print(f"[{run_id}] reports={total} resolved={len(resolved)}")
          gsm = os.environ.get("GITHUB_STEP_SUMMARY")
          if gsm:
              with open(gsm, "a") as f:
                  f.write(f"### {run_id}\n\nreports **{total}** · resolved **{len(resolved)}**\n\n")
          PYEOF
          ls -la "$OUT"

      - name: Upload batch results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reeval-batch-${{ matrix.batch_id }}
          path: /tmp/reeval_out/
          retention-days: 90
